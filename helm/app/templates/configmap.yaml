apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html><body>
    <h1>{{ .Values.message }}</h1>
    <p>Environment: {{ .Values.environment }} | Release: {{ .Release.Name }}</p>
    </body></html>
